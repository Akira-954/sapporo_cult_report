<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPPORO CULT REPORT</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase JS SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- Exif.js -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <!-- heic2any (HEIC to JPEG 変換ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
    }
    #map {
      height: 100vh;
      width: 100vw;
    }
    .popup-img {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      border-radius: 4px;
    }
    .tag-badge {
      display: inline-block;
      background: #eef2f5;
      color: #333;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      margin-right: 4px;
      margin-top: 4px;
    }

    /* フィルターUIのコンテナ */
    .filter-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9990;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .date-filter-select {
      height: 36px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 13px;
      font-weight: bold;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    /* 投稿ボタン */
    .post-trigger-btn {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    /* 現在地ボタン */
    .locate-btn {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 1000;
      background: #ffffff;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .locate-btn svg {
      width: 24px;
      height: 24px;
      fill: #333;
    }

    /* 投稿フォームモーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      -webkit-overflow-scrolling: touch;
    }
    .modal-content h2 { margin-top: 0; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #555; font-weight: bold; }
    .form-group input[type="text"],
    .form-group input[type="date"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
      -webkit-appearance: none;
      appearance: none;
    }

    .form-group textarea {
      height: auto;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #f8f9fa;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
    }
    .checkbox-item input {
      margin-right: 6px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-cancel { background: #eee; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-submit { background: #ff3b30; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    
    .exif-status {
      font-size: 11px;
      margin-top: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- 画面左上のヘッダーコントロール -->
<div class="filter-container" id="filter-container">
  <select id="date-filter" class="date-filter-select">
    <option value="recent_year">直近1年間（すべて）</option>
    <option value="all">全期間</option>
    <!-- 年オプションは JS で動的生成 -->
  </select>
  <button class="post-trigger-btn" id="open-form-btn">＋ 報告</button>
</div>

<button id="locate-btn" class="locate-btn" title="現在地に移動">
  <svg viewBox="0 0 24 24">
    <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
  </svg>
</button>

<!-- 投稿フォームモーダル -->
<div class="modal-overlay" id="post-modal">
  <div class="modal-content">
    <h2>怪文書の新規投稿</h2>
    <form id="post-form">

      <div class="form-group">
        <label>写真 * (GPS位置情報・撮影日時付き)</label>
        <input type="file" id="post-image" accept="image/*" required>
        <div class="exif-status" id="exif-status"></div>
      </div>

      <div class="form-group">
        <label>発見日 *</label>
        <input type="date" id="post-found-at" required>
      </div>

      <div class="form-group">
        <label>カテゴリ</label>
        <select id="post-category">
          <option value="denchu">電柱怪文書</option>
          <option value="etc">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label>特徴（複数選択可）</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" name="post-tags" value="コインボランティア">コインボランティア</label>
          <label class="checkbox-item"><input type="checkbox" name="post-tags" value="水濡れ">水濡れ</label>
        </div>
      </div>

      <div class="form-group">
        <label>説明・解読メモ</label>
        <textarea id="post-desc" rows="3" placeholder="書かれている内容や特徴"></textarea>
      </div>
      
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="close-form-btn">キャンセル</button>
        <button type="submit" class="btn-submit" id="submit-btn">投稿する</button>
      </div>
    </form>
  </div>
</div>

<script>
  // 1. Supabase 初期化
  const SUPABASE_URL = 'https://ixvogawbwssnxgdilhyi.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_005UZ6tUpnTfsEd5_PmmdA_ABG_kXJO';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('post-found-at').valueAsDate = new Date();

  // 2. Leaflet マップ初期化
  const map = L.map('map').setView([43.0642, 141.3469], 13);
  const markerGroup = L.layerGroup().addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // 年フィルタのセレクトボックス初期化 (直近1年間 + 過去の年リスト)
  const dateFilterSelect = document.getElementById('date-filter');
  function initDateFilter() {
    const currentYear = new Date().getFullYear();
    for (let year = currentYear; year >= currentYear - 5; year--) {
      const option = document.createElement('option');
      option.value = String(year);
      option.textContent = `${year}年`;
      dateFilterSelect.appendChild(option);
    }
  }
  initDateFilter();

    // URLから指定したパラメータを取得する関数
  function getUrlParam(paramName) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(paramName);
  }
  
  // ページ読み込み時に 'author' パラメータを取得（例: ?author=A さん ➔ "Aさん"）
  const currentAuthor = getUrlParam('author');

  // 3. マップ上のピンを表示する関数（日付フィルター対応）
  async function loadMarkers(lat, lng, radiusMeters = 10000) {
    try {
      const { data, error } = await supabaseClient.rpc('get_documents_nearby', {
        lat: lat,
        lng: lng,
        radius_meters: radiusMeters
      });

      if (error) return console.error('Supabase Error:', error.message);

      // マーカーをリセット
      markerGroup.clearLayers();

      if (data) {
        const selectedFilter = dateFilterSelect.value;
        const now = new Date();
        const oneYearAgo = new Date();
        oneYearAgo.setFullYear(now.getFullYear() - 1);

        // クライアント側で日付フィルタリング
        const filteredData = data.filter(doc => {
          if (!doc.found_at) return false;
          
          if (selectedFilter === 'recent_year') {
            // 直近1年間（found_atが1年前の今日以降）
            const foundDate = new Date(doc.found_at);
            return foundDate >= oneYearAgo;
          } else {
            // 指定年（'YYYY' で前方一致判定）
            return doc.found_at.startsWith(selectedFilter);
          }
        });

        filteredData.forEach(doc => {
          const tagsHtml = doc.tags && doc.tags.length > 0 
            ? doc.tags.map(tag => `<span class="tag-badge">#${tag}</span>`).join('') 
            : '';

          const foundDate = doc.found_at ? doc.found_at : '不明';
          const createdDate = doc.created_at ? new Date(doc.created_at).toLocaleDateString('ja-JP') : '';

          const popupContent = `
            <div style="max-width: 220px;">
              <img src="${doc.image_url}" class="popup-img" alt="怪文書画像"/>
              <h3 style="margin: 8px 0 4px 0; font-size: 15px;">${doc.title || '怪文書'}</h3>
              <div style="font-size: 11px; color: #888; margin-bottom: 6px;">
                📅 発見: ${foundDate} / 登録: ${createdDate}
              </div>
              <p style="font-size: 12px; color: #444; margin: 0 0 6px 0;">${doc.description || ''}</p>
              <div style="margin-bottom: 8px;">${tagsHtml}</div>
              <button class="delete-btn" onclick="deleteDocument('${doc.id}')" style="
                background: none;
                border: 1px solid #d9534f;
                color: #d9534f;
                padding: 3px 8px;
                border-radius: 4px;
                font-size: 11px;
                cursor: pointer;
                width: 100%;
              ">🗑 データを削除する</button>
            </div>
          `;

          L.circleMarker([doc.lat, doc.lng], {
            radius: 7,            // ★サイズ（小さめ。好みに合わせて 6〜9 などで調整）
            fillColor: '#ff3b30', // ★赤色（塗りつぶし）
            color: '#ffffff',     // ★枠線の色（白）
            weight: 2,            // ★枠線の太さ
            opacity: 1,           // 枠線の不透明度
            fillOpacity: 0.9      // 塗りつぶしの不透明度
          })
          .bindPopup(popupContent)
          .addTo(markerGroup);
      }
    } catch (e) {
      console.error('Fetch Error:', e);
    }
  }

  // 年選択が変更されたときのイベントハンドラ
  dateFilterSelect.addEventListener('change', () => {
    const center = map.getCenter();
    loadMarkers(center.lat, center.lng);
  });

  // 初期読み込み
  const center = map.getCenter();
  loadMarkers(center.lat, center.lng);

  map.on('moveend', () => {
    const newCenter = map.getCenter();
    loadMarkers(newCenter.lat, newCenter.lng);
  });

  // 4. 現在地取得機能
  let currentLocationMarker = null;
  document.getElementById('locate-btn').addEventListener('click', () => {
    if (!navigator.geolocation) return alert('位置情報に対応していません。');

    navigator.geolocation.getCurrentPosition((position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      map.flyTo([lat, lng], 15);

      if (currentLocationMarker) map.removeLayer(currentLocationMarker);

      currentLocationMarker = L.circleMarker([lat, lng], {
        radius: 8, fillColor: '#007aff', color: '#ffffff', weight: 2, fillOpacity: 0.9
      }).addTo(map).bindPopup('現在地').openPopup();
    });
  });

  // 5. 画像圧縮処理関数
  function compressImage(file, maxWidth = 1600, maxHeight = 1600, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;

        if (width > maxWidth || height > maxHeight) {
          if (width > height) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          } else {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        canvas.toBlob(
          (blob) => {
            if (!blob) return reject(new Error('Canvas to Blob conversion failed'));
            const compressedFileName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";
            const compressedFile = new File([blob], compressedFileName, {
              type: 'image/jpeg',
              lastModified: Date.now()
            });
            resolve(compressedFile);
          },
          'image/jpeg',
          quality
        );
      };
      img.onerror = (err) => reject(err);
      img.src = URL.createObjectURL(file);
    });
  }

  // 6. Exif 解析＆自動圧縮処理
  let targetLocation = null;
  let convertedFile = null;
  let photoFormattedDateTime = null;

  function convertDMSToDD(dms, ref) {
    if (!dms) return null;
    let dd = dms[0] + dms[1] / 60 + dms[2] / 3600;
    if (ref === "S" || ref === "W") dd = dd * -1;
    return dd;
  }

  function formatExifDateTime(dateTimeStr) {
    if (!dateTimeStr) return null;
    const parts = dateTimeStr.split(' ');
    if (parts.length < 2) return null;
    const dateParts = parts[0].split(':');
    const timeParts = parts[1].split(':');
    if (dateParts.length === 3 && timeParts.length >= 2) {
      return `${dateParts[0]}年${dateParts[1]}月${dateParts[2]}日 ${timeParts[0]}:${timeParts[1]}`;
    }
    return null;
  }

  const fileInput = document.getElementById('post-image');
  const exifStatus = document.getElementById('exif-status');
  const submitBtn = document.getElementById('submit-btn');

  fileInput.addEventListener('change', async function(e) {
    let file = e.target.files[0];
    if (!file) return;

    exifStatus.style.color = '#007aff';
    exifStatus.textContent = '画像を処理中...';
    targetLocation = null;
    convertedFile = null;
    photoFormattedDateTime = null;

    const fileNameLower = file.name.toLowerCase();
    const isHeic = fileNameLower.endsWith('.heic') || fileNameLower.endsWith('.heif') || file.type === 'image/heic';

    if (isHeic) {
      exifStatus.textContent = '🔄 HEIC画像をJPEGに変換中...';
      try {
        const convertedBlob = await heic2any({
          blob: file,
          toType: 'image/jpeg',
          quality: 0.8
        });

        const blobResult = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
        const newFileName = file.name.replace(/\.(heic|heif)$/i, '.jpg');
        file = new File([blobResult], newFileName, { type: 'image/jpeg' });
      } catch (err) {
        console.error('HEIC変換エラー:', err);
        exifStatus.style.color = '#d9534f';
        exifStatus.textContent = '❌ HEIC画像の変換に失敗しました。';
        return;
      }
    }

    exifStatus.textContent = '写真のExif情報を解析中...';

    EXIF.getData(file, async function() {
      const latData = EXIF.getTag(this, 'GPSLatitude');
      const latRef = EXIF.getTag(this, 'GPSLatitudeRef');
      const lngData = EXIF.getTag(this, 'GPSLongitude');
      const lngRef = EXIF.getTag(this, 'GPSLongitudeRef');

      const lat = convertDMSToDD(latData, latRef);
      const lng = convertDMSToDD(lngData, lngRef);

      const dateTime = EXIF.getTag(this, 'DateTimeOriginal') || EXIF.getTag(this, 'DateTime');
      if (dateTime) {
        const datePart = dateTime.split(' ')[0].replace(/:/g, '-');
        document.getElementById('post-found-at').value = datePart;
        photoFormattedDateTime = formatExifDateTime(dateTime);
      }

      if (lat && lng) {
        targetLocation = { lat: lat, lng: lng };
        exifStatus.textContent = '⚡ 画像を自動最適化（圧縮）中...';
        try {
          convertedFile = await compressImage(file, 1600, 1600, 0.8);
          exifStatus.style.color = '#28a745';
          exifStatus.textContent = `✓ 位置情報取得完了 (${lat.toFixed(4)}, ${lng.toFixed(4)}) ・ 画像圧縮完了`;
          map.flyTo([lat, lng], 16);
        } catch (compressErr) {
          console.error('圧縮エラー:', compressErr);
          convertedFile = file;
          exifStatus.style.color = '#28a745';
          exifStatus.textContent = `✓ 位置情報取得完了 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
        }
      } else {
        targetLocation = null;
        exifStatus.style.color = '#d9534f';
        exifStatus.textContent = '❌ エラー: この写真にはGPS位置情報（Exif）が含まれていません。';
      }
    });
  });

  // 7. 投稿送信処理
  const modal = document.getElementById('post-modal');
  const openBtn = document.getElementById('open-form-btn');
  const closeBtn = document.getElementById('close-form-btn');
  const postForm = document.getElementById('post-form');
  const filterContainer = document.getElementById('filter-container');

  L.DomEvent.disableClickPropagation(filterContainer);
  L.DomEvent.disableClickPropagation(modal);
  
  openBtn.addEventListener('click', () => {
    modal.style.display = 'flex';
    exifStatus.textContent = '';
    targetLocation = null;
    photoFormattedDateTime = null;
  });
  
  closeBtn.addEventListener('click', () => modal.style.display = 'none');
  postForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!targetLocation) {
      alert('⚠️ 選択された写真から位置情報（Exif）を取得できませんでした。');
      return;
    }

    const targetLat = targetLocation.lat;
    const targetLng = targetLocation.lng;

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    try {
      const foundAt = document.getElementById('post-found-at').value;
      const category = document.getElementById('post-category').value;
      const description = document.getElementById('post-desc').value;

      const title = photoFormattedDateTime || `${foundAt}の投稿`;

      const file = convertedFile || fileInput.files[0];
      if (!file) return alert('画像を選択してください。');

      const checkedTags = Array.from(
        document.querySelectorAll('input[name="post-tags"]:checked')
      ).map(cb => cb.value);

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('strange-docs')
        .upload(fileName, file, {
          contentType: file.type
        });

      if (uploadError) throw uploadError;

      const { data: urlData } = supabaseClient.storage
        .from('strange-docs')
        .getPublicUrl(fileName);

      // C. Databaseへデータ挿入
      const { error: insertError } = await supabaseClient
        .from('documents')
        .insert([
          {
            title: title,
            found_at: foundAt,
            category: category,
            tags: checkedTags,
            description: description,
            image_url: urlData.publicUrl,
            location: `SRID=4326;POINT(${targetLng} ${targetLat})`,
            is_approved: true,
            author: currentAuthor // ★ URLから取得したAさん等の名前・IDをセット（無ければ null）
          }
        ]);

      if (insertError) throw insertError;

      alert('投稿が完了しました！');
      
      postForm.reset();
      document.getElementById('post-found-at').valueAsDate = new Date();
      exifStatus.textContent = '';
      targetLocation = null;
      convertedFile = null;
      photoFormattedDateTime = null;
      modal.style.display = 'none';

      map.flyTo([targetLat, targetLng], 16);
      loadMarkers(targetLat, targetLng);

    } catch (err) {
      console.error('投稿エラー:', err);
      alert('投稿に失敗しました: ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '投稿する';
    }
  });

  // 8. 削除処理
  async function deleteDocument(docId) {
    const password = prompt('削除するためのパスワードを入力してください:');
    
    if (password === null) return;
    if (password.trim() === '') {
      alert('パスワードを入力してください。');
      return;
    }

    if (!confirm('本当にこの投稿を削除しますか？')) return;

    try {
      const { data: isSuccess, error } = await supabaseClient.rpc('delete_document_with_password', {
        doc_id: docId,
        pass: password
      });

      if (error) throw error;

      if (isSuccess) {
        alert('データを削除しました。');
        const center = map.getCenter();
        loadMarkers(center.lat, center.lng);
      } else {
        alert('❌ パスワードが正しくありません。');
      }
    } catch (err) {
      console.error('削除エラー:', err);
      alert('削除処理に失敗しました: ' + err.message);
    }
  }
</script>

</body>
</html>
